<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ledger · Accounting Exam Trainer</title>
<meta name="description" content="203 accounting exam scenarios. Journal entries, adjustments, depreciation, bonds, closing, and ratios, with a timer and full explanations.">
<meta name="theme-color" content="#fff7fa">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e0306f'/%3E%3Cpath d='M22 18h8v22h14v8H22z' fill='white'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#fff7fa;
  --paper:#ffffff;
  --ink:#251621;
  --ink2:#4d3846;
  --muted:#8d7484;
  --faint:#b9a3af;
  --line:#f4dbe5;
  --line2:#ecc4d5;
  --pink:#e0306f;
  --pink-deep:#c11f5a;
  --pink-soft:#ffe6ef;
  --pink-wash:#fff0f5;
  --green:#0e9f6e;
  --green-soft:#e6f9f1;
  --green-line:#9fe3c8;
  --red:#dd3b55;
  --red-soft:#ffebee;
  --red-line:#f3b3bd;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 18px 50px rgba(196,28,92,.07);
  --shadow-lg:0 30px 90px rgba(196,28,92,.13);
}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(900px 520px at 88% -12%, #ffe0ec 0%, rgba(255,224,236,0) 62%),
    radial-gradient(760px 520px at -8% 14%, #ffeaf3 0%, rgba(255,234,243,0) 58%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(to bottom,rgba(224,48,111,.07) 1px,transparent 1px);
  background-size:100% 46px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 62%);
  mask-image:linear-gradient(to bottom,#000 0%,transparent 62%);
  opacity:.55;
}
button{font:inherit;color:inherit}
::selection{background:#ffd0e2;color:#3a1024}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.top{position:relative;z-index:97;display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1060px;margin:0 auto;padding:24px 26px}
.brand{display:flex;align-items:center;gap:11px;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.brand .mark{width:11px;height:11px;border-radius:3px;background:var(--pink);box-shadow:0 0 0 4px rgba(224,48,111,.1)}
.brand span{color:var(--faint);font-weight:500;letter-spacing:.16em}
.sound{appearance:none;border:1px solid var(--line2);background:rgba(255,255,255,.7);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px}
.sound:hover{border-color:var(--pink);color:var(--pink-deep);background:#fff}
.sound i{width:6px;height:6px;border-radius:50%;background:var(--pink);display:block}
.sound.off i{background:var(--faint)}
.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:0 26px}

/* ---------- home ---------- */
.home{padding-top:52px;padding-bottom:60px}
.eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 22px;font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-deep)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--pink);display:block}
h1{font-size:clamp(46px,8.6vw,86px);line-height:.96;letter-spacing:-.045em;font-weight:650;margin:0;color:var(--ink)}
h1 .pink{color:var(--pink)}
.lede{max-width:540px;margin:26px 0 0;font-size:16.5px;line-height:1.66;color:var(--ink2)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;align-items:center}
.btn{appearance:none;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:15px 22px;border-radius:999px;font-size:14px;font-weight:650;letter-spacing:-.005em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--pink);background:#fff}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 12px 30px rgba(224,48,111,.24)}
.btn.primary:hover{background:var(--pink-deep);border-color:var(--pink-deep);box-shadow:0 16px 36px rgba(224,48,111,.3)}
.btn .k{font-family:var(--mono);font-size:10.5px;font-weight:500;opacity:.55;letter-spacing:.02em}
.btn.primary .k{opacity:.9}
.btn.ghost{background:rgba(255,255,255,.55)}
.btn.wide{width:100%;padding:16px 20px}
.hero-meta{margin:16px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:56px 0 14px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.section-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.section-head p{margin:0;font-size:11px;color:var(--faint);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{appearance:none;text-align:left;display:flex;gap:15px;align-items:flex-start;padding:19px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pink);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.card:hover{border-color:var(--line2);background:#fff;transform:translateY(-2px);box-shadow:var(--shadow)}
.card:hover::after{transform:scaleY(1)}
.card .no{font-family:var(--mono);font-size:10.5px;color:var(--pink);padding-top:3px;min-width:18px}
.card h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.card p{margin:5px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.card .row{display:flex;gap:8px;align-items:center;margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.card .row b{color:var(--pink-deep);font-weight:600}
.foot{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
.foot span{font-family:var(--mono)}

/* ---------- game ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(255,247,250,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hud-row{max-width:880px;margin:0 auto;padding:12px 26px 10px;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto 34px 34px;align-items:center;gap:12px}
.iconbtn{appearance:none;border:1px solid transparent;background:transparent;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.16s}
.iconbtn:hover{background:#fff;border-color:var(--line2);color:var(--pink-deep)}
.hud-label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-timer{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 4px}
.hud-score{display:flex;align-items:baseline;gap:5px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--pink-deep);font-weight:700;font-size:14px}
.hud-score small{font-size:8.5px;letter-spacing:.12em;color:var(--faint);font-weight:600}
.dots{display:flex;gap:2px;padding:0 26px 8px;max-width:880px;margin:0 auto}
.dot{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .2s}
.dot.ok{background:var(--green)}
.dot.bad{background:var(--red)}
.dot.cur{background:var(--pink)}
.game{padding-top:34px;padding-bottom:120px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.qnum{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chip{font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-deep);background:var(--pink-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.qcard{border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow);padding:30px 30px 26px}
.qcard.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.scenario{margin:0 0 20px;font-size:17px;line-height:1.68;color:var(--ink2);letter-spacing:-.005em}
.scenario::first-letter{text-transform:uppercase}
.prompt{margin:0 0 20px;font-size:19px;line-height:1.45;font-weight:650;letter-spacing:-.018em;color:var(--ink);padding-left:14px;border-left:2px solid var(--pink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;position:relative;display:block;width:100%;text-align:left;padding:14px 16px 14px 48px;border:1px solid var(--line);border-radius:13px;background:#fffdfe;cursor:pointer;transition:border-color .15s,background .15s,transform .15s,opacity .2s;color:var(--ink)}
.opt:hover{border-color:var(--pink);background:var(--pink-wash);transform:translateX(2px)}
.opt .idx{position:absolute;left:0;top:0;bottom:0;width:37px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);border-right:1px solid transparent}
.opt:hover .idx{color:var(--pink)}
.opt.correct{border-color:var(--green-line);background:var(--green-soft)}
.opt.correct .idx{color:var(--green);border-right-color:rgba(14,159,110,.18)}
.opt.wrong{border-color:var(--red-line);background:var(--red-soft)}
.opt.wrong .idx{color:var(--red);border-right-color:rgba(221,59,85,.18)}
.opt.dead{opacity:.4}
.opt.dead:hover{transform:none;border-color:var(--line);background:#fffdfe}
.opt.locked{cursor:default;pointer-events:none}
.txt{font-size:14.5px;line-height:1.5;font-weight:500}
.entry{display:flex;flex-direction:column;gap:4px}
.ln{display:flex;align-items:baseline;gap:9px;font-family:var(--mono);font-size:13px;line-height:1.5}
.dc{flex:none;width:24px;text-align:center;font-size:9px;letter-spacing:.06em;font-weight:700;padding:2px 0;border-radius:3px}
.dc.dr{color:#1d6fb8;background:rgba(29,111,184,.09)}
.dc.cr{color:#a33f78;background:rgba(163,63,120,.09)}
.acct{flex:1;min-width:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{flex:none;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.sep{height:1px;background:var(--line);margin:5px 0 4px}
.hint{margin-top:18px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;font-family:var(--mono)}

/* ---------- flash ---------- */
#flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0}
#flash.ok{animation:flash .72s ease-out;background:radial-gradient(ellipse at 50% 46%,rgba(14,159,110,.30),rgba(14,159,110,.10) 46%,rgba(14,159,110,0) 74%);box-shadow:inset 0 0 190px 50px rgba(14,159,110,.4)}
#flash.bad{animation:flash .72s ease-out;background:radial-gradient(ellipse at 50% 46%,rgba(221,59,85,.30),rgba(221,59,85,.10) 46%,rgba(221,59,85,0) 74%);box-shadow:inset 0 0 190px 50px rgba(221,59,85,.42)}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- feedback sheet ---------- */
.sheet{position:fixed;left:50%;bottom:0;z-index:70;width:min(760px,100%);transform:translate(-50%,110%);background:var(--paper);border:1px solid var(--line2);border-bottom:none;border-radius:22px 22px 0 0;box-shadow:0 -30px 90px rgba(120,20,60,.18);transition:transform .34s cubic-bezier(.22,1,.36,1);max-height:min(90vh,780px);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translate(-50%,0)}
.sheet.ok{border-top:3px solid var(--green)}
.sheet.bad{border-top:3px solid var(--red)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 24px 0;flex:0 0 auto}
.verdict{font-size:11px;font-weight:750;letter-spacing:.19em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;display:block}
.verdict.ok{color:var(--green)}.verdict.ok::before{background:var(--green)}
.verdict.bad{color:var(--red)}.verdict.bad::before{background:var(--red)}
.pts{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--pink-deep)}
.pts.zero{color:var(--faint)}
.sheet-body{flex:1 1 auto;min-height:0;padding:16px 24px 4px;overflow-y:auto;overscroll-behavior:contain}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fffdfe;color:var(--ink)}
.blk.good{border-color:var(--green-line);border-left:3px solid var(--green);background:#eafaf3}
.blk.bad{border-color:var(--red-line);border-left:3px solid var(--red);background:var(--red-soft)}
.lbl{font-size:10px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 7px}
.lbl.g{color:#086b4b}.lbl.r{color:#a12236}
.why{margin:13px 0 0;font-size:13.5px;line-height:1.62;color:var(--ink2)}
.why b{color:var(--ink);font-weight:700}
.why.last{margin-bottom:16px}
.sheet .btn{flex:0 0 auto;margin:12px 24px calc(18px + env(safe-area-inset-bottom))}
.sheet-body .blk + .lbl{margin-top:16px}

/* ---------- results ---------- */
.results{padding-top:46px;padding-bottom:70px}
.res-head{text-align:center;margin-bottom:30px}
.res-head .eyebrow{justify-content:center;margin-bottom:16px}
.res-head .eyebrow::before{display:none}
.rank{font-size:clamp(38px,7vw,62px);line-height:1.02;letter-spacing:-.045em;font-weight:650;margin:0;color:var(--ink)}
.rank-sub{margin:14px auto 0;max-width:480px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:30px 0 12px}
.stat{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.78);padding:16px 14px;text-align:center}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .v.pink{color:var(--pink-deep)}
.stat .l{margin-top:5px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.note-card{margin:26px 0 8px;padding:24px 26px;border:1px solid var(--line2);border-radius:18px;background:linear-gradient(135deg,#fff 0%,#fff4f8 100%);position:relative;overflow:hidden}
.note-card::before{content:"“";position:absolute;right:18px;top:-18px;font-size:110px;line-height:1;color:rgba(224,48,111,.1);font-family:Georgia,serif}
.note-card p{margin:0;font-size:15.5px;line-height:1.68;color:var(--ink);max-width:600px;position:relative;letter-spacing:-.005em}
.note-card .sig{margin-top:13px;font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--pink-deep)}
.panel{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);padding:20px 22px;margin-top:12px}
.panel h3{margin:0 0 14px;font-size:10.5px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.brk{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;margin:9px 0;font-size:11.5px;color:var(--ink2)}
.brk .track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.brk .fill{height:100%;border-radius:3px;background:var(--pink)}
.brk .fill.good{background:var(--green)}
.brk .pct{font-family:var(--mono);font-size:10.5px;text-align:right;color:var(--muted)}
details.miss{border-bottom:1px solid var(--line);padding:12px 0}
details.miss:last-child{border-bottom:none;padding-bottom:0}
details.miss summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink)}
details.miss summary::-webkit-details-marker{display:none}
details.miss summary::before{content:"+";font-family:var(--mono);color:var(--pink);font-size:14px;line-height:1.3;flex:none}
details.miss[open] summary::before{content:"−"}
details.miss .body{padding:12px 0 2px 22px}
details.miss .body .lbl{margin-top:10px}
.res-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;justify-content:center}

#fx{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}

@media(max-width:720px){
  .top{padding:18px 20px}
  .brand span{display:none}
  .wrap{padding:0 20px}
  .home{padding-top:34px}
  .grid{grid-template-columns:1fr}
  .qcard{padding:22px 20px 20px;border-radius:17px}
  .scenario{font-size:15.5px;line-height:1.66}
  .prompt{font-size:17px}
  .ln{font-size:12px;gap:7px}
  .dc{width:21px;font-size:8.5px}
  .opt{padding:13px 13px 13px 44px}
  .opt .idx{width:34px}
  .hud-row{padding:10px 20px 8px;gap:8px;grid-template-columns:30px minmax(0,1fr) auto auto 30px 30px}
  .hud-timer{font-size:15px}
  .dots{padding:0 20px 7px}
  .stats{grid-template-columns:1fr 1fr}
  .brk{grid-template-columns:110px 1fr 42px;font-size:10.5px}
  .sheet-top{padding:17px 18px 0}
  .sheet-body{padding:14px 18px 0}
  .sheet .btn{flex:0 0 auto;margin:12px 18px calc(16px + env(safe-area-inset-bottom))}
  .foot{flex-direction:column;gap:6px}
  .results{padding-top:30px}
}
@media(max-width:420px){
  .hero-meta{font-size:9px;letter-spacing:.08em}
  .hud-label{display:none}
  .hud-row{grid-template-columns:30px 1fr auto 30px 30px}
  .hud-row .hud-timer{justify-self:center}
  .hud-score{display:none}
  .stat .v{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .qcard.shake{animation:none}
  #flash.ok,#flash.bad{animation:none;opacity:0}
  .marathon{animation:none;background-position:0% 50%}
  .m-flame svg,.m-bigflame{animation:none}
}

/* ---------- marathon ---------- */
.marathon{position:relative;width:100%;display:flex;align-items:center;gap:16px;margin:12px 0 0;padding:18px 22px;border:1px solid rgba(255,190,120,.6);border-radius:18px;background:linear-gradient(112deg,#c1121f 0%,#ff3d00 28%,#ff7a00 52%,#ffb000 76%,#ffd166 100%);background-size:220% 100%;animation:fireShift 8s ease-in-out infinite,firePulse 3.2s ease-in-out infinite;color:#fff;text-align:left;cursor:pointer;overflow:hidden;transition:transform .2s}
.marathon:hover{transform:translateY(-2px);animation-duration:4.5s,1.8s}
.marathon::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 160px at 20% 120%,rgba(255,220,150,.4),transparent 70%);pointer-events:none;z-index:1}
.marathon::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-55%;height:95%;background:radial-gradient(ellipse at 18% 100%,rgba(255,190,80,.6),transparent 60%),radial-gradient(ellipse at 55% 100%,rgba(255,70,0,.55),transparent 62%),radial-gradient(ellipse at 88% 100%,rgba(255,220,120,.45),transparent 60%);filter:blur(16px);pointer-events:none;animation:fireLick 4.8s ease-in-out infinite;z-index:0}
.m-bigflame{position:absolute;right:120px;bottom:-54px;width:182px;height:182px;color:rgba(255,205,95,.22);z-index:1;pointer-events:none;filter:drop-shadow(0 0 30px rgba(255,100,0,.55));transform:rotate(-7deg)}
.m-bigflame svg{width:100%;height:100%}
.m-flame{position:relative;z-index:2;flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(255,170,60,.5),rgba(255,255,255,.08));border:1px solid rgba(255,210,140,.55);box-shadow:0 0 26px rgba(255,120,0,.7),inset 0 0 18px rgba(255,160,40,.4);color:#ffd166}
.m-flame svg{width:28px;height:28px;animation:flicker 2.4s ease-in-out infinite;filter:drop-shadow(0 0 9px rgba(255,140,0,.95))}
.m-copy{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:4px}
.m-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-badge{font-size:7.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:#ffd166;color:#5a1200;box-shadow:0 0 14px rgba(255,180,60,.6)}
.m-title{font-size:16px;font-weight:750;letter-spacing:-.015em;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.m-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18)}
.m-desc{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.86);max-width:440px}
.m-go{position:relative;z-index:2;margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.m-go svg{width:12px;height:12px}
.embers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.embers i{position:absolute;bottom:-8px;left:var(--x);width:4px;height:4px;border-radius:50%;background:#ffd9a0;box-shadow:0 0 9px #ff6a00,0 0 18px rgba(255,106,0,.6);opacity:0;animation:ember var(--d) linear infinite;animation-delay:var(--t)}
@keyframes fireShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes firePulse{0%,100%{box-shadow:0 18px 55px rgba(255,88,0,.3),inset 0 1px 0 rgba(255,255,255,.22)}50%{box-shadow:0 24px 78px rgba(255,88,0,.55),inset 0 1px 0 rgba(255,255,255,.32)}}
@keyframes fireLick{0%,100%{transform:translateY(0) scaleY(1);opacity:.8}50%{transform:translateY(-7px) scaleY(1.18);opacity:1}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg);opacity:.9}45%{transform:scale(1.12) rotate(3deg);opacity:1}}
@keyframes ember{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.9}100%{transform:translateY(-100px) scale(.15);opacity:0}}
body.marathon-mode{background:radial-gradient(900px 520px at 88% -12%,#ffe0cf 0%,rgba(255,224,207,0) 62%),radial-gradient(760px 520px at -8% 14%,#ffe9df 0%,rgba(255,233,223,0) 58%),#fff8f4}
body.marathon-mode::before{background-image:linear-gradient(to bottom,rgba(255,106,0,.08) 1px,transparent 1px)}
body.marathon-mode .hud{background:rgba(255,248,244,.88);border-bottom-color:#ffd9c2}
body.marathon-mode .hud::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#e0306f,#ff6a00,#ffb347,#ff6a00,#e0306f);background-size:200% 100%;animation:fireShift 4s linear infinite}
body.marathon-mode .hud-label{color:#b23a00;font-weight:650}
body.marathon-mode .hud-timer,body.marathon-mode .hud-score{color:#c2410c}
body.marathon-mode .dot.cur{background:#ff6a00}
body.marathon-mode .chip{color:#b23a00;background:#ffe5d4}
body.marathon-mode .prompt{border-left-color:#ff6a00}
body.marathon-mode .qcard{position:relative;border-color:#ffd0b0;box-shadow:0 18px 50px rgba(255,106,0,.12);overflow:hidden}
body.marathon-mode .qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:0;background:linear-gradient(90deg,#e0306f,#ff6a00,#ffb347,#ff6a00);background-size:200% 100%;animation:fireShift 4s linear infinite}
body.marathon-mode .opt:hover{border-color:#ff6a00;background:#fff4ec}
body.marathon-mode .qnav .navbtn:hover:not(:disabled){border-color:#ff6a00;color:#c2410c}
body.marathon-mode .sheet .btn.primary{background:linear-gradient(90deg,#e0306f,#ff6a00);border-color:#ff6a00}
.lab-fire{display:inline-flex;vertical-align:-3px;margin-right:6px;color:#ff6a00}
.lab-fire svg{width:12px;height:12px}
.cta-note{max-width:230px;font-size:11.5px;line-height:1.45;color:var(--faint)}
.credit{margin:8px 0 0;font-size:11.5px;letter-spacing:.06em;color:var(--faint)}
.credit b{color:var(--pink-deep);font-weight:650}
.who{margin:12px 0 0;font-size:11px;letter-spacing:.04em;color:var(--faint)}
.who b{color:var(--pink-deep);font-weight:650}
.eyebrow.hot{color:#c2410c}
.lb-line{margin:10px 0 0;text-align:center;font-size:11px;letter-spacing:.05em;color:var(--pink-deep);font-weight:650;min-height:16px}
.lb-line.off{color:var(--muted);font-weight:500}

/* ---------- name gate and confirm ---------- */
.gate{position:fixed;inset:0;z-index:130;background:rgba(37,22,33,.45);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:22px}
.gate-card{width:min(420px,100%);background:#fff;border:1px solid var(--line2);border-radius:20px;padding:26px;box-shadow:0 40px 110px rgba(110,15,55,.3);animation:gateIn .24s ease}
.gate-card h2{margin:0;font-size:26px;letter-spacing:-.035em;line-height:1.1;font-weight:650}
.gate-sub{margin:10px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.gate input{display:block;width:100%;margin-top:18px;padding:14px 15px;border:1px solid var(--line2);border-radius:11px;background:#fffafc;color:var(--ink);font:inherit;font-size:16px}
.gate input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(224,48,111,.12)}
.gate-err{min-height:16px;margin:7px 0 0;font-size:11px;color:var(--red);font-weight:600}
.gate-actions{display:flex;gap:8px;margin-top:8px}
.gate-actions .btn{flex:1;padding:13px 16px}
.gate-card.confirm{width:min(390px,100%)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 12px 30px rgba(221,59,85,.22)}
.btn.danger:hover{background:#c62c45;border-color:#c62c45}
@keyframes gateIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- leaderboard ---------- */
.board{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.76);overflow:hidden;box-shadow:var(--shadow)}
.board-tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 11px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:.15s}
.tab:hover{color:var(--pink-deep);background:var(--pink-wash)}
.tab.on{color:#fff;background:var(--pink);border-color:var(--pink)}
.lb-head,.lb-row{display:grid;grid-template-columns:32px minmax(0,1fr) 64px 48px 54px;gap:8px;align-items:center;padding:8px 16px}
.lb-head{font-size:8.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:8px}
.lb-head span:nth-child(n+3){text-align:right}
.lb-row{border-bottom:1px solid var(--line);font-size:12.5px;padding-top:10px;padding-bottom:10px}
.lb-row:last-child{border-bottom:none}
.lb-row.top{background:linear-gradient(90deg,rgba(224,48,111,.08),transparent)}
.lb-rank{font-family:var(--mono);font-size:10px;color:var(--faint)}
.lb-row.top .lb-rank{color:var(--pink)}
.lb-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-family:var(--mono);font-weight:700;text-align:right;color:var(--pink-deep)}
.lb-acc,.lb-time{font-family:var(--mono);font-size:10.5px;text-align:right;color:var(--muted)}
.board-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:12.5px}

@media(max-width:720px){
  .marathon{flex-wrap:wrap;gap:12px;padding:16px 18px}
  .m-bigflame{right:-38px;bottom:-58px;width:150px;height:150px}
  .m-flame{width:40px;height:40px}
  .m-flame svg{width:21px;height:21px}
  .m-desc{max-width:100%}
  .m-go{margin-left:0;width:100%;justify-content:center;margin-top:2px}
  .cta-note{max-width:100%}
  .gate{padding:16px;align-items:flex-start;padding-top:9vh;overflow-y:auto}
  .gate#confirm{align-items:center;padding-top:16px}
  .gate-card{padding:22px}
}
@media(max-width:520px){
  .lb-head,.lb-row{grid-template-columns:26px minmax(0,1fr) 54px 46px}
  .lb-head span:nth-child(4),.lb-acc{display:none}
  .gate-card h2{font-size:23px}
}


/* ---------- exam notes ---------- */
.sheet .btn.wide{width:auto;align-self:stretch}
.notes{padding-top:38px;padding-bottom:70px}
.notes-left{display:flex;align-items:center;gap:10px}
.notes-print{padding:9px 15px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.notes-head{max-width:700px;margin-bottom:26px}
.notes-head h1{font-size:clamp(34px,6.4vw,56px);line-height:1.02;letter-spacing:-.045em;font-weight:650;margin:0}
.notes-head .lede{margin-top:16px}
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note-side{border:1px solid var(--line);border-radius:16px;background:#fff;padding:20px 20px 16px;box-shadow:var(--shadow)}
.note-side .nlabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin:0 0 5px}
.note-side h3{margin:0 0 13px;font-size:16.5px;letter-spacing:-.025em;line-height:1.2;color:var(--ink)}
.n-block{margin:0 0 11px}
.n-block:last-child{margin-bottom:0}
.n-block h4{margin:0 0 4px;font-size:8px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-deep)}
.n-block ul{margin:0;padding:0;list-style:none}
.n-block li{position:relative;padding-left:9px;margin:2px 0;font-size:11px;line-height:1.42;color:var(--ink2)}
.n-block li::before{content:"·";position:absolute;left:0;color:var(--faint)}
.n-block.mono li{font-family:var(--mono);font-size:9.8px;line-height:1.5;color:var(--ink);letter-spacing:-.01em}
.notes-foot{margin-top:18px;font-size:10.5px;color:var(--faint);text-align:center;letter-spacing:.04em}
.notes-teaser{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#fff 0%,#fff2f8 100%);box-shadow:var(--shadow)}
.notes-teaser h3{margin:0;font-size:16px;letter-spacing:-.02em}
.notes-teaser p{margin:6px 0 0;max-width:560px;font-size:12.5px;line-height:1.55;color:var(--muted)}
.notes-teaser .btn{flex:none}
@media(max-width:720px){
  .note-grid{grid-template-columns:1fr}
  .n-block li{font-size:11.5px}
  .n-block.mono li{font-size:10.5px}
  .notes-teaser{flex-direction:column;align-items:flex-start}
  .notes-teaser .btn{width:100%}
  .notes{padding-top:24px}
  .note-side{padding:17px 16px 13px}
}
@media print{
  body{background:#fff !important}
  body::before,#fx,.top,.notes-head,.notes-foot{display:none !important}
  .notes{padding:0 !important;max-width:none !important}
  .notes-head{margin:0 0 10px !important;max-width:none !important}
  .notes-head h1{font-size:18pt !important}
  .note-grid{display:block !important}
  .note-side{break-after:page;border:none !important;box-shadow:none !important;border-radius:0 !important;padding:0.42in !important;margin:0 !important}
  .note-side:last-child{break-after:auto}
  .note-side .nlabel{font-size:7pt !important}
  .note-side h3{font-size:13pt !important;margin-bottom:7px !important}
  .n-block{margin-bottom:6px !important}
  .n-block h4{font-size:6.5pt !important}
  .n-block li{font-size:7.8pt !important;line-height:1.32 !important}
  .n-block.mono li{font-size:7.2pt !important}
}


/* ---------- question review ---------- */
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.qnav .navbtn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;padding:9px 14px;font-size:11px;font-weight:650;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.qnav .navbtn:hover:not(:disabled){border-color:var(--pink);color:var(--pink-deep);background:#fff}
.qnav .navbtn:disabled{opacity:.35;cursor:not-allowed}
.qnav .qpos{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.review-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:11.5px;font-weight:600;background:var(--pink-wash);color:var(--pink-deep);flex-wrap:wrap}
.review-banner.good{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.review-banner.bad{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.review-banner button{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.05em;cursor:pointer}
.review-explain{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.dot{position:relative}
.dot[data-q]{cursor:pointer}
.dot[data-q]::after{content:"";position:absolute;inset:-7px -1px}
.dot.view{box-shadow:0 0 0 2px rgba(224,48,111,.28)}
.notes-foot p{margin:0 0 12px}
@media(max-width:420px){
  .qnav .navbtn{padding:8px 10px;font-size:10px}
  .qnav .qpos{font-size:9px}
}


/* ---------- results leaderboard and mistake review ---------- */
.result-board{padding:20px 0 8px}
.result-board h3{padding:0 22px}
.result-board .lb-head{border-top:1px solid var(--line)}
.result-board .lb-head,.result-board .lb-row{padding-left:22px;padding-right:22px}
.lb-row.me{background:linear-gradient(90deg,rgba(224,48,111,.13),transparent);box-shadow:inset 3px 0 0 var(--pink)}
.lb-name em{font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);margin-left:6px;font-weight:700}
.jump{margin:6px 0 14px;text-align:center;font-size:11px;letter-spacing:.04em}
.jump a{color:var(--pink-deep);text-decoration:none;border-bottom:1px solid rgba(224,48,111,.3);padding-bottom:1px}
.jump a:hover{border-bottom-color:var(--pink)}
.panel-sub{margin:-6px 0 14px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.mq{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--pink);flex:none;padding-top:2px}
@media(max-width:720px){
  .result-board h3{padding:0 16px}
  .result-board .lb-head,.result-board .lb-row{padding-left:16px;padding-right:16px}
}


/* readable answer text, including browser auto-dark modes */
.blk.good,.blk.good .acct,.blk.good .amt,.blk.good .txt{color:var(--ink)}
.blk.bad,.blk.bad .acct,.blk.bad .amt,.blk.bad .txt{color:var(--ink)}
.opt.correct,.opt.correct .acct,.opt.correct .amt,.opt.correct .txt{color:var(--ink)}


/* ---------- pause ---------- */
.paused #app,.paused #sheet{filter:blur(16px);pointer-events:none;user-select:none}
.pause{position:fixed;inset:0;z-index:140;background:rgba(37,22,33,.48);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:22px}
.pause-card{width:min(390px,100%);background:#fff;border:1px solid var(--line2);border-radius:20px;padding:28px;box-shadow:0 40px 110px rgba(110,15,55,.32);text-align:center;animation:gateIn .24s ease}
.pause-mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:var(--pink-wash);color:var(--pink);border:1px solid var(--line2)}
.pause-card h2{margin:0;font-size:29px;letter-spacing:-.04em;line-height:1.08;font-weight:650}
.pause-card .gate-sub{margin:10px 0 18px}
.pause-card .btn{width:100%;padding:14px 16px}
@media(max-width:720px){
  .pause{padding:16px}
  .pause-card{padding:24px}
}
